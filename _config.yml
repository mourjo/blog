title: Mourjo Sen's Blog
description: Thoughts of a software engineer about life, tech and everything in between. A place to put down my thoughts for my own recollection more than anything else. If you like it, be sure to drop me an email!
baseurl: /blog
url: https://mourjo.me
author:
  twitter: mourjo_sen
email: mourjo@mourjo.me
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  syntax_highlighter_opts:
    disable : true

twitter:
  username: mourjo_sen
  card: summary

social:
  name: Mourjo Sen
  links:
    - https://github.com/mourjo
    - https://www.linkedin.com/in/mourjo
    - https://www.facebook.com/sen.mourjo
    - https://twitter.com/mourjo_sen


sass:
    style: compressed

exclude:
- README.md
- Makefile
- Gemfile
- Gemfile.lock
- copy_from_obsidian.py
- deploy.sh
- _scripts

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  tags:
    except:
      - hidden

# Semantic + keyword (BM25) search, see https://github.com/mourjo/jekyll-semantic-search
# Model chosen by benchmarking 15 models on this blog's labelled queries
# (eval/queries/mourjo-blog.json): gte-small matches the 300-400 MB models
# within one query at a 34 MB download.
semantic_search:
  collections: [posts]
  model: Xenova/gte-small
  dtype: q8
  min_score: auto
  keyword_search:
    enabled: true
    weight: 0.3       # 0.2-0.5 gave identical results
    min_score: 0.5    # 0.4 lets unrelated queries through, 0.6 loses typos
