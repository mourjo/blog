title: Mourjo Sen's Blog
description: Thoughts of a software engineer about life, tech and everything in between. A place to put down my thoughts for my own recollection more than anything else. If you like it, be sure to drop me an email!
baseurl: /blog
url: https://mourjo.me
author:
  twitter: mourjo_sen
email: mourjo@mourjo.me
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  syntax_highlighter_opts:
    disable : true

twitter:
  username: mourjo_sen
  card: summary

social:
  name: Mourjo Sen
  links:
    - https://github.com/mourjo
    - https://www.linkedin.com/in/mourjo
    - https://www.facebook.com/sen.mourjo
    - https://twitter.com/mourjo_sen


sass:
    style: compressed

exclude:
- README.md
- Makefile
- Gemfile
- Gemfile.lock
- copy_from_obsidian.py
- deploy.sh
- _scripts

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  tags:
    except:
      - hidden

# Keyword matching over the external articles in search.json (Medium etc.),
# shown after the semantic results. Set to false for semantic search only.
keyword_search: true

semantic_search:
  model: Xenova/all-MiniLM-L12-v2
  # Cosine similarity cut-off. Tuned by hand: off-topic queries peak at ~0.27,
  # the weakest correct match in testing scored ~0.29.
  min_score: 0.28
  preload_model: false   # the ~32 MB model downloads on first focus of the search bar
