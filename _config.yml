title: Mourjo Sen's Blog
description: Thoughts of a software engineer about life, tech and everything in between. A place to put down my thoughts for my own recollection more than anything else. If you like it, be sure to drop me an email!
baseurl: /blog
url: https://mourjo.me
author:
  twitter: mourjo_sen
email: mourjo@mourjo.me
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  syntax_highlighter_opts:
    disable : true

twitter:
  username: mourjo_sen
  card: summary

social:
  name: Mourjo Sen
  links:
    - https://github.com/mourjo
    - https://www.linkedin.com/in/mourjo
    - https://www.facebook.com/sen.mourjo
    - https://twitter.com/mourjo_sen


sass:
    style: compressed

exclude:
- README.md
- Makefile
- Gemfile
- Gemfile.lock
- copy_from_obsidian.py
- deploy.sh
- _scripts

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  tags:
    except:
      - hidden

# Search: semantic + BM25 keyword search. Every setting is explained in the
# README's "Search" section.
semantic_search:
  model: Xenova/all-MiniLM-L12-v2
  # Cosine similarity cut-off. Off-topic queries score up to ~0.26 in the
  # browser, the weakest correct match in testing ~0.30.
  min_score: 0.28
  preload_model: false   # the ~32 MB model downloads on first focus of the search bar

  # BM25 keyword search, combined with the semantic results to catch exact and
  # near word matches that embeddings miss.
  keyword_search:
    enabled: true
    weight: 0.3              # share of the final score from BM25 (rest is semantic)
    min_score: 0.4           # normalised BM25 needed to show a keyword-only match
    k1: 1.2
    b: 0.75
    title_boost: 3           # title words count this many times
    semantic_ceiling: 0.69   # cosine treated as a perfect semantic match
    extra_documents: external_articles   # _data file: external articles, keyword-only
